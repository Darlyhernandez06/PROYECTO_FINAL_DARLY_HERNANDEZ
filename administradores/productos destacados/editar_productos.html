<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡ACTUALIZAR PRODUCTO DESTACADO!</title>
    <!-- Enlace al archivo CSS para estilos -->
    <link rel="stylesheet" href="editar_productos.css">
    <!-- Favicon para el navegador -->
    <link rel="icon" type="image/svg" href="../../imagenes/logo.svg">
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</head>
<body>
    <!-- Contenedor principal con título y línea decorativa -->
    <div class="contenedor__principal">
        <p class="titulo__principal">Productos destacados</p>
        <div class="contenedor__linea"></div>
    </div>

    <!-- Formulario para actualizar producto con estilo de Bootstrap y margen superior -->
    <div class="borde container mt-5 bg-white p-5 text-center">
        <h2 class="mb-5 pb-5 text-center titulo">Actualizar Producto</h2>
        <form id="formEditarProducto" class="px-5">
            <!-- Campo oculto para almacenar el índice del producto -->
            <input type="hidden" id="product-id">
            <!-- Campo para el nombre del producto -->
            <div class="pb-4 form-group">
                <label class="form__label" for="nombre">Nombre del Producto</label>
                <input class="form__input" class="form-control" type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre del producto" required>
            </div>
            <!-- Campo para el precio del producto -->
            <div class="pb-4 form-group">
                <label class= "form__label" for="precio">Precio</label>
                <input class= "form__input" type="number" class="form-control" id="precio" name="precio" placeholder="Ingrese el precio del producto" required>
            </div>
             <!-- Campo para la URL de la imagen del producto -->
            <div class="pb-4 form-group">
                <label class="form__label" for="imagen">Imagen</label>
                <input class="form__input" class="form-control" type="text" id="imagen" name="imagen" placeholder="URL de la imagen del producto" required>
            </div>
            <!-- Campo para seleccionar la categoría del producto -->
            <div class="pb-4 form-group">
                <label class="form__label" for="categoria">Categorías</label>
                <select class="form__input" class="form-control" id="categoria" name="categoria"> 
                    <option value="0">Seleccionar la Categoría...</option>
                    <option value="Verduras">Verduras</option>
                    <option value="Frutas">Frutas</option>
                    <option value="Tubérculos/Hortalizas">Tubérculos/Hortalizas</option>
                </select>
            </div>            
            <!-- Botón para actualizar el producto -->
            <div class="boton__actualizar">
                <button type="submit" class="boton__actualizar--link" style="border: none">Actualizar Producto</button>
            </div>
        </form>
    </div>
    <!-- Botón para regresar a la página anterior -->
    <div class="boton__regresar pb-5">
        <a href="../../administradores/pagina_principal.html" class="boton__regresar--link" style="text-decoration: none;">Regresar</a>
    </div>

    <script src="editar_productos.js"></script>
</body>
</html>
