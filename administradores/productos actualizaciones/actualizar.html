<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡ACTUALIZAR PRODUCTO!</title>
    <!-- Enlace al archivo CSS para estilos -->
    <link rel="stylesheet" href="actualizar.css">
    <!-- Favicon para el navegador -->
    <link rel="icon" type="image/svg" href="../../imagenes/logo.svg">
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
</head>
<body>
    
    <!-- Contenedor principal con título y línea decorativa -->
    <div class="contenedor__principal">
        <p class="titulo__principal">Gestión de Productos</p>
        <div class="contenedor__linea"></div>
    </div>

    <!-- Formulario para actualizar producto con estilo de Bootstrap y margen superior -->
    <div class="borde container mt-5 bg-white p-5 text-center">
        <h2 class="mb-5 pb-5 text-center titulo">Actualizar Producto</h2>
        <form id="update-product-form" class="px-5" novalidate>
            <!-- Campo oculto para almacenar el índice del producto -->
            <input type="hidden" id="product-id">
            <!-- Campo para el nombre del producto -->
            <div class="pb-4 form-group">
                <label class="form__label" for="product-name">Nombre del Producto</label>
                <input class="form__input" class="form-control" type="text" id="product-name" placeholder="Ingrese el nombre del producto" required>
            </div>
             <!-- Campo para la descripción del producto -->
            <div class="pb-4 form-group">
                <label class="form__label" for="product-description">Descripción</label>
                <textarea class="form__input" class="form-control" id="product-description" rows="3" placeholder="Ingrese la descripción del producto" required></textarea>
                <span id="error_descripcion_producto" class="error-message"></span>
            </div>
            <!-- Campo para el precio del producto -->
            <div class="pb-4 form-group">
                <label class= "form__label" for="product-price">Precio</label>
                <input class= "form__input" type="number" class="form-control" id="product-price" placeholder="Ingrese el precio del producto" required>
                <span id="error_precio_producto" class="error-message"></span>
            </div>
            <!-- Campo para la cantidad del producto -->
            <div class="pb-4 form-group">
                <label class= "form__label" for="product-quantity">Cantidad</label>
                <input class= "form__input" type="number" class="form-control" id="product-quantity" placeholder="Ingrese la cantidad del producto" required/>
                <span id="error_cantidad_producto" class="error-message"></span>
            </div>
            <!-- Campo para la URL de la imagen del producto -->
            <div class="pb-4 form-group">
                <label class= "form__label" for="product-quantity">Imagen del producto:</label>
                <img id="product-preview" alt="Vista previa de la imagen" width="300" style="border: 4px solid #4DA768;">
            </div>          
            <!-- Campo para seleccionar la categoría del producto -->
            <!-- Campo para seleccionar la categoría del producto -->
            <div class="pb-4 form-group productCategory">
                <label class= "form__label" for="productCategory">Categorias</label>
                <select id="productCategory" class= "form__input" class="form-control" required> 
                    <option value="">Seleccionar la Categoria...</option>
                    <option value="Verduras">Verduras</option>
                    <option value="Frutas">Frutas</option>
                    <option value="Tuberculos/Hortalizas">Tuberculos/Hortalizas</option>
                </select>
                <span id="error_select_producto" class="error-message"></span>
            </div>
            <!-- Botón para actualizar el producto -->
            <div class="boton__actualizar">
                <button type="submit" class="boton__actualizar--link" style="border: none">Actualizar Producto</button>
            </div>
        </form>
    </div>
    <!-- Botón para regresar a la página anterior -->
    <div class="boton__regresar pb-5">
        <a href="../productos actualizaciones/listar.html" class="boton__regresar--link" style="text-decoration: none;">Regresar</a>
    </div>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="actualizar.js" type="module"></script>
    <script src="validaciones.js" type="module"></script>
</body>
</html>
