<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡MI CARRITO!</title>
    <!-- Enlace al archivo CSS para estilos -->
    <link rel="stylesheet" href="carrito.css">
    <!-- Favicon para el navegador -->
    <link rel="icon" type="image/svg" href="../../imagenes/logo.svg">
</head>
<body>
    <!-- Sección principal del carrito-->
    <section class="contenedor__principal">
        <div class="contenedor__micarrito">
            <!-- Contenedor del título -->
            <div class="contenedor__titulo">
                <p><strong>Mi carrito</strong></p>
            </div>
            <!-- Línea separadora -->
            <div class="contenedor__linea"></div>

            <!-- Contenedor para los productos del carrito -->
            <div id="carritoProductos" class="contenedor__productos">
                <!-- Aquí se mostrarán los productos agregados al carrito -->
            </div>
            <div id="total" class="total"></div>
        </div>
    </section>

    <!-- Botón para regresar a la tienda -->
    <div class="boton__regresar">
        <a href="#" id="botonFinalizarCompra" class="boton__regresar--link">Finalizar Compra</a>
        
        <a href="../pagina_principal.html" class="boton__regresar--link">Volver a la tienda</a>
    </div>

    <template id="productTemplate">
        <div class="producto">
            <div class="producto__imagen">
                <img src="" alt="">
            </div>
            <div class="producto__detalles">
                <h3 class="producto__nombre"></h3>
                <p class="producto__precio"></p>
                <p class="producto__cantidad"></p>
            </div>
            <a class="boton__eliminar">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="red" class="bi bi-trash3" viewBox="0 0 16 16">
                    <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                </svg>
            </a>
        </div>
    </template>

    <template id="carritoTemplate">
        <div class="contenedor__informacion">
            <div class="contenedor__dentro">
                <div class="contenedor__informacion--imagen">
                    <img src="../../imagenes/logo ningun pedido.svg" alt="logo">
                </div>
                <div class="contenedor__informacion--texto">
                    <p><strong>Tu carrito está vacío.</strong></p>
                </div>
            </div>
        </div>
    </template>

    <!-- Pie de página -->
    <footer class="footer">
        <p class="footer__parrafo">@Megapaquetes</p>
    </footer>

    <!-- Script para manejar la lógica del carrito -->
    <script src="carrito.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
